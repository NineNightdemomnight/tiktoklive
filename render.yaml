services:
  - type: web
    name: tiklive-gift-stage
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: OVERLAY_KEY
        generateValue: true
      - key: CONTROL_PASSWORD
        generateValue: true
